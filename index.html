<!doctype html>
<html lang="en">

  <head>
    <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
  <link rel="stylesheet" href="style.css">

  <script src="ArtistData.js"></script>
  <script src="RedrawnArtistDataUtils.js"></script>

    <title>Retro Redrawn Artist Data</title>
  </head>

  <body>
    <header class="site-header">
      <img src="website/retro_redrawn_logo.png" alt="Retro Redrawn" class="site-logo">
    </header>
    <main class="page-content">
      <div class="artist-toolbar">
        <p id="ArtistCount" class="artist-count"></p>
        <section class="artist-controls" aria-label="Artist display options">
          <div class="artist-control">
            <label for="RedrawnFilter">Filter by project</label>
            <select id="RedrawnFilter">
              <option value="all">All projects</option>
            </select>
          </div>
          <div class="artist-control">
            <label for="ArtistSort">Sort artists</label>
            <select id="ArtistSort">
              <option value="alphabetical">Alphabetically (A to Z)</option>
              <option value="reverseAlphabetical">Alphabetically (Z to A)</option>
              <option value="medals">Most medals</option>
            </select>
          </div>
        </section>
      </div>
      <div id="ArtistCollection" class="artist-grid"></div>
    </main>
    <script src="ArtistImageLoader.js"></script>
  </body>
